[project]
name = "claude-reviewer-bot"
version = "0.2.0"
description = "Bot que revisa Pull Requests de GitHub con Claude Code cuando alguien comenta /claude-review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
claude-review = "claude_reviewer_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_reviewer_bot"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8
